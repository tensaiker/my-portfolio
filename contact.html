<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerby Cruz - Contact</title>

    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome for social and download icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ============================================================
         NAVIGATION BAR
         - Active brown pill applied to "Contact"
         - Filled dark brown variant for "Download CV" button
    ============================================================ -->
    <nav id="navbar">
        <div class="logo">
            <a href="index.html">Kerby Cruz</a>
        </div>

        <div class="nav-links">
            <a href="index.html" class="nav-item">Home</a>
            <a href="about.html" class="nav-item">About</a>
            <a href="skills.html" class="nav-item">Skills</a>
            <a href="projects.html" class="nav-item">Projects</a>
            <!-- Active pill state on Contact -->
            <a href="contact.html" class="nav-item active">Contact</a>

            <!-- 
                Filled Dark Brown CV Button matching Frame 112:
                Replace '#' with your resume file path (e.g., "assets/Kerby_Cruz_CV.pdf")
            -->
            <a href="#" class="btn-nav filled-dark" download>
                Download CV
            </a>
        </div>
    </nav>

    <!-- ============================================================
         CONTACT SECTION
         - Left-aligned headline and description
         - Centered social media / contact links pinned towards the bottom
    ============================================================ -->
    <main class="container contact-container">

        <!-- Top Content Block -->
        <div class="contact-header">
            <!-- Section Pill Badge -->
            <span class="pill brown-pill">Get in touch</span>

            <!-- Main Heading -->
            <h1 class="contact-title">Have a project in mind?</h1>

            <!-- Subtitle -->
            <p class="contact-subtitle">
                I'm always interested in opportunities to learn, build, and contribute.
            </p>
        </div>

        <!-- 
            Bottom Contact / Social Links:
            Replace the '#' placeholders with your actual profile URLs and email address
        -->
        <div class="social-links-footer">
            <!-- GitHub Link -->
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link-item">
                <i class="fa-brands fa-github"></i>
                <span>Github</span>
            </a>

            <!-- LinkedIn Link -->
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-link-item">
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>

            <!-- Email Link (Opens the user's default email client) -->
            <a href="mailto:your.email@example.com" class="social-link-item">
                <i class="fa-solid fa-envelope"></i>
                <span>Email</span>
            </a>
        </div>

    </main>

    <!-- Connect script.js to manage active navigation tab clicks -->
    <script src="script.js"></script>
</body>
</html>
